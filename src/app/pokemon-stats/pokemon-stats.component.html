<div>
    <h6>Type:</h6>
    <ul>
        @for (e of pokemon.types; track e) {
            <li><a href="">{{e}}</a></li>
        }
    </ul>
    <h6>Bio:</h6>
    <p>{{pokemon.bio}}</p>
    <h6>Evolutions:</h6>
    <ul>
        @for (e of pokemon.evolutions; track e) {
            <li><a href="">{{e}}</a></li>
        }
    </ul>
</div>
